<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Walk &amp; Talk</title>
  <meta name="description" content="Our date ideas, plans and memories.">
  <meta name="theme-color" content="#EFE7DC">
  <script>
    // Pick the season + light/dark before the page draws, so it never flashes the wrong colors
    (function () {
      var r = document.documentElement, get = function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } };
      var mode = get('wt-theme', 'auto'), season = get('wt-season', 'auto');
      var months = ['winter','winter','spring','spring','spring','summer','summer','summer','fall','fall','fall','winter'];
      r.dataset.theme = mode;
      r.dataset.mode = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      r.dataset.season = season === 'auto' ? months[new Date().getMonth()] : season;
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Walk &amp; Talk">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Nunito:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><main class="auth"><img class="auth-logo" src="icons/icon.svg" alt="" width="72" height="72"></main></div>
  <noscript>Walk &amp; Talk needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
